<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massive Square Scorebug Overlay - HDMI Chroma Key</title>
    <style>
        /* Base Viewport Canvas - Changed to pure Chroma Key Green for HDMI output */
        html, body {
            background-color: #00ff00; /* Pure green screen background */
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 800; color: #ffffff;
            user-select: none; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Massive Square Container Box */
        .scorebug-container {
            display: flex;
            flex-direction: column; 
            background-color: #0b0c10;
            border-radius: 4vh;
            box-shadow: 0 4vh 10vh rgba(0,0,0,0.8);
            
            /* Shaped as a massive square based on the screen's height */
            width: 90vh; 
            height: 90vh; 
            overflow: hidden;
            border: 1.5vh solid #1f2833;
            box-sizing: border-box;
        }

        /* Team Row Element Layouts */
        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 27.5vh; 
            border-bottom: 1vh solid #2d323f;
        }
        .team-title {
            padding: 0 6vh;
            font-size: 11vh; 
            letter-spacing: 0.5vh;
            height: 100%;
            display: flex;
            align-items: center;
            flex-grow: 1;
            font-weight: 900;
        }
        .away-team .team-title { background-color: #bd1f36; } 
        .home-team .team-title { background-color: #1f4ebd; } 
        
        .score-val {
            background-color: #1f232b;
            font-size: 14vh; 
            width: 28vh;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        /* Bottom Game Stats Data Bar */
        .status-row {
            display: flex;
            align-items: center;
            height: 35vh;
            background-color: #151922;
        }

        .data-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex: 1;
        }
        .data-segment:not(:last-child) {
            border-right: 1vh solid #2d323f;
        }

        /* Inning layouts */
        .arrow-indicator { font-size: 7vh; margin-right: 1.5vh; color: #fca311; line-height: 1; }
        .inning-num { font-size: 11vh; font-weight: 900; line-height: 1; }
        
        /* Diamond Runners Mapping */
        .diamond-wrap { position: relative; width: 14vh; height: 14vh; transform: rotate(45deg); }
        .base-pad { position: absolute; width: 5.5vh; height: 5.5vh; background-color: #454d5a; border: 0.8vh solid #151922; border-radius: 0.5vh; }
        .base-pad.b-1 { top: 0; right: 0; }
        .base-pad.b-2 { top: 0; left: 0; }
        .base-pad.b-3 { bottom: 0; left: 0; }
        .base-pad.occupied { background-color: #fca311; box-shadow: 0 0 4vh #fca311; }

        /* BSO Count Tracking Matrix Layout */
        .matrix-column { display: flex; flex-direction: column; gap: 2vh; font-size: 4vh; color: #8d99ae; }
        .matrix-row { display: flex; align-items: center; }
        .row-header { width: 4vh; font-size: 4vh; font-weight: bold; text-align: center; }
        .dot-grid { display: flex; gap: 1.5vh; margin-left: 2vh; }
        .indicator-dot { width: 4vh; height: 4vh; border-radius: 50%; background-color: #3d4554; }
        .indicator-dot.b-active { background-color: #00f5d4; }
        .indicator-dot.s-active { background-color: #ff5400; }
        .indicator-dot.o-active { background-color: #fca311; }
    </style>
</head>
<body>

    <div class="scorebug-container">
        <!-- Away Team Segment -->
        <div class="team-row away-team">
            <div class="team-title" id="disp-away-name">AWY</div>
            <div class="score-val" id="disp-away-score">0</div>
        </div>

        <!-- Home Team Segment -->
        <div class="team-row home-team">
            <div class="team-title" id="disp-home-name">HOM</div>
            <div class="score-val" id="disp-home-score">0</div>
        </div>

        <!-- Status Tracking Base Bar -->
        <div class="status-row">
            <!-- Inning display block -->
            <div class="data-segment">
                <span class="arrow-indicator" id="disp-inning-arrow">&#9650;</span>
                <span class="inning-num" id="disp-inning-num">1</span>
            </div>

            <!-- Base runner graphic map -->
            <div class="data-segment">
                <div class="diamond-wrap">
                    <div class="base-pad b-2" id="disp-base-2"></div>
                    <div class="base-pad b-1" id="disp-base-1"></div>
                    <div class="base-pad b-3" id="disp-base-3"></div>
                </div>
            </div>

            <!-- Ball, Strike, Out data dots tracker -->
            <div class="data-segment">
                <div class="matrix-column">
                    <div class="matrix-row">
                        <span class="row-header">B</span>
                        <div class="dot-grid"><div class="indicator-dot" id="dot-b1"></div><div class="indicator-dot" id="dot-b2"></div><div class="indicator-dot" id="dot-b3"></div></div>
                    </div>
                    <div class="matrix-row">
                        <span class="row-header">S</span>
                        <div class="dot-grid"><div class="indicator-dot" id="dot-s1"></div><div class="indicator-dot" id="dot-s2"></div></div>
                    </div>
                    <div class="matrix-row">
                        <span class="row-header">O</span>
                        <div class="dot-grid"><div class="indicator-dot" id="dot-o1"></div><div class="indicator-dot" id="dot-o2"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function pull() {
            const cache = localStorage.getItem('yolo_softball_engine');
            if(!cache) return;
            const state = JSON.parse(cache);
            document.getElementById('disp-away-name').innerText = state.awayName;
            document.getElementById('disp-home-name').innerText = state.homeName;
            document.getElementById('disp-away-score').innerText = state.away;
            document.getElementById('disp-home-score').innerText = state.home;
            document.getElementById('disp-inning-num').innerText = state.inning;
            document.getElementById('disp-inning-arrow').innerHTML = state.isTop ? '&#9650;' : '&#9660;';
            for(let i=1; i<=3; i++) document.getElementById(`dot-b${i}`).classList.toggle('b-active', state.b >= i);
            for(let i=1; i<=2; i++) document.getElementById(`dot-s${i}`).classList.toggle('s-active', state.s >= i);
            for(let i=1; i<=2; i++) document.getElementById(`dot-o${i}`).classList.toggle('o-active', state.o >= i);
            for(let i=1; i<=3; i++) document.getElementById(`disp-base-${i}`).classList.toggle('occupied', state.runners[i]);
        }
        window.addEventListener('storage', pull);
        setInterval(pull, 200);
        pull();
    </script>
</body>
</html>
